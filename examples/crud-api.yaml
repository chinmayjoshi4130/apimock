openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: A simple task management API for demonstration
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /tasks:
    get:
      summary: List all tasks
      description: Returns a list of tasks, optionally filtered by status
      parameters:
        - name: status
          in: query
          description: Filter tasks by status
          schema:
            type: string
            enum: [pending, done]
        - name: limit
          in: query
          description: Maximum number of tasks to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      summary: Create a new task
      description: Creates a new task and returns it
      requestBody:
        description: Task to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
  /tasks/{id}:
    get:
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    patch:
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        description: Task fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          description: Unique identifier
          minimum: 1
        title:
          type: string
          description: Task title
          maxLength: 200
        description:
          type: string
          description: Task description
        status:
          type: string
          description: Task status
          enum: [pending, done]
          default: pending
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        due_date:
          type: string
          format: date
          description: Due date
    TaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 200
          example: "Learn ApiMock"
        description:
          type: string
          example: "Read the documentation and try examples"
        status:
          type: string
          enum: [pending, done]
          default: pending
        due_date:
          type: string
          format: date
          example: "2024-12-31"